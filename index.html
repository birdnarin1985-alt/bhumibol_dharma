<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Dharma Engine | Karma Paths & Cellular Dam</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        .pure-hud {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(2, 6, 23, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 0.95rem;
            color: #38bdf8;
            font-family: 'Prompt', sans-serif;
            pointer-events: none;
            letter-spacing: 1px;
            text-align: center;
            transition: all 1s ease-in-out;
            box-shadow: 0 0 20px rgba(2, 6, 23, 0.8);
        }
        .pure-hud span {
            color: #fbbf24;
            font-weight: 600;
            display: block;
            margin-top: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="pure-hud" id="hud-text">
        สภาวะว่างเปล่า (สุญญตา)
        <span id="sub-text">...รอการปฏิสนธิ...</span>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. 16-BIT INDEXED PALETTE (มหาภูตรูป) ---
        const Palette = {
            void: 0x0f172a,       // สุญญตา
            mountain: 0x064e3b,   // ปฐวีธาตุ (ภูเขา)
            damCore: 0x64748b,    // โครงสร้าง (เขื่อนเหล็ก/คอนกรีต)
            damGlow: 0x38bdf8,    // พลังงานในเขื่อน
            water: 0x0284c7,      // อาโปธาตุ
            origin: 0xfbbf24      // จุดกำเนิด / พลังงานชีวิต
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(Palette.void);
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- 2. สถาปัตยกรรม "เส้นกรรมและดีเอ็นเอ" (Karma & DNA Architecture) ---
        const cellCount = 10000; // เพิ่มโหนดเป็น 10,000 จุด เพื่อความสมจริง
        const sphereGeo = new THREE.SphereGeometry(0.15, 6, 6);
        const sphereMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x000000, transparent: true, opacity: 0.9 });
        const instancedCells = new THREE.InstancedMesh(sphereGeo, sphereMat, cellCount);
        scene.add(instancedCells);

        const cellData = [];
        const dummy = new THREE.Object3D();
        const originPoint = new THREE.Vector3(0, -5, 0); // Zygote (จุดปฏิสนธิ)

        // ฟังก์ชันสร้าง DNA เป้าหมายตามหน้าที่กรรม
        for (let i = 0; i < cellCount; i++) {
            let targetX, targetY, targetZ;
            let colorHex;
            let type = Math.random();

            if (type < 0.45) {
                // กรรมเป็น "สันเขื่อนโค้ง (Arch Dam)" (45% ของเซลล์)
                let angle = (Math.random() * Math.PI) - (Math.PI / 2); // โค้งครึ่งวงกลม
                let radius = 14 + (Math.random() * 2); // ความหนาเขื่อน
                targetX = Math.sin(angle) * radius;
                targetZ = Math.cos(angle) * radius * 0.5 - 5; // ปรับความโค้ง
                targetY = (Math.random() * 16) - 2; // ความสูงเขื่อน
                colorHex = (Math.random() > 0.8) ? Palette.damGlow : Palette.damCore;
                
            } else if (type < 0.8) {
                // กรรมเป็น "ภูเขา 2 ฝั่ง (Mountains)" (35% ของเซลล์)
                let side = (Math.random() > 0.5) ? 1 : -1;
                let r = Math.random() * 12;
                let theta = Math.random() * Math.PI * 2;
                targetX = (20 * side) + (r * Math.cos(theta));
                targetZ = -4 + (r * Math.sin(theta));
                targetY = -3 + ( (12 - r) * (Math.random() * 1.5) ); // ทรงกรวยภูเขา
                colorHex = Palette.mountain;
                
            } else {
                // กรรมเป็น "มวลน้ำ (Water)" (20% ของเซลล์)
                targetX = (Math.random() - 0.5) * 35;
                targetZ = 5 + (Math.random() * 20);
                targetY = -1 + (Math.random() * 1);
                colorHex = Palette.water;
            }

            let target = new THREE.Vector3(targetX, targetY, targetZ);
            
            // "เส้นกรรม" (Control Point สำหรับ Quadratic Bezier Curve)
            // เซลล์จะวิ่งโค้งบานออกไปด้านข้างและพุ่งขึ้นบน ก่อนจะลงจอดที่เป้าหมาย
            let controlX = targetX * 1.5; 
            let controlY = targetY + 15 + (Math.random() * 10);
            let controlZ = targetZ * 1.5;
            let controlPoint = new THREE.Vector3(controlX, controlY, controlZ);

            // "วาระแห่งกรรม" (DNA Timing)
            // เซลล์ฐานราก (y ต่ำ) จะเกิดก่อน โตก่อน (delay น้อย)
            let normalizedHeight = (targetY + 5) / 25; 
            let karmaDelay = Math.max(0, Math.min(1, normalizedHeight + (Math.random() * 0.2)));

            cellData.push({
                origin: originPoint.clone(),
                target: target,
                control: controlPoint,
                color: new THREE.Color(colorHex),
                karmaDelay: karmaDelay, // 0.0 - 1.0 (กำหนดคิวการเดินทาง)
                karmaSpeed: 0.8 + Math.random() * 0.4
            });

            instancedCells.setColorAt(i, cellData[i].color);
        }
        instancedCells.instanceColor.needsUpdate = true;

        // --- 3. THE BREATHING & MITOSIS LOOP ---
        const clock = new THREE.Clock();
        const hudText = document.getElementById('hud-text');
        const subText = document.getElementById('sub-text');

        // ฟังก์ชันสมการเส้นโค้ง Quadratic Bezier (วิถีแห่งเส้นกรรม)
        function getBezierPoint(t, p0, p1, p2) {
            let u = 1 - t;
            let tt = t * t;
            let uu = u * u;
            let p = new THREE.Vector3();
            p.x = uu * p0.x + 2 * u * t * p1.x + tt * p2.x;
            p.y = uu * p0.y + 2 * u * t * p1.y + tt * p2.y;
            p.z = uu * p0.z + 2 * u * t * p1.z + tt * p2.z;
            return p;
        }

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // ลมหายใจ (Cycle 0.0 -> 1.0 -> 0.0) รอบละ 16 วินาที
            let breathRaw = Math.sin(time * 0.4); 
            let globalBreath = (breathRaw + 1) / 2; // ค่า 0 ถึง 1

            // อัปเดต HUD ตามสภาวะ
            if (globalBreath < 0.1) {
                hudText.childNodes[0].nodeValue = "สุญญตา (ว่างเปล่า)";
                subText.innerText = "เซลล์รอการปฏิสนธิ ณ แก่นกลาง";
                hudText.style.opacity = "0.4";
            } else if (globalBreath >= 0.1 && globalBreath < 0.9) {
                let status = (Math.cos(time * 0.4) > 0) ? "ปฏิสนธิ & เติบโต" : "คลายตัว & แตกสลาย";
                hudText.childNodes[0].nodeValue = status;
                subText.innerText = "เซลล์เดินทางตามเส้นกรรม (DNA) ก่อเป็นรูปขันธ์";
                hudText.style.opacity = "0.9";
            } else {
                hudText.childNodes[0].nodeValue = "สถิตยภูมิ (ตั้งมั่น)";
                subText.innerText = "รูปทรงเขื่อนสมบูรณ์ชั่วขณะ (อนิจจัง)";
                hudText.style.opacity = "1.0";
            }

            // คำนวณวิถีชีวิตของเซลล์แต่ละตัว
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                
                // คำนวณความคืบหน้าของเซลล์แต่ละตัวตาม "วาระแห่งกรรม (karmaDelay)"
                // ถ้า globalBreath ไปไม่ถึง delay ของมัน มันจะยังไม่ออกเดินทาง
                let lifeProgress = 0;
                let activeRange = 0.5; // ใช้เวลา 50% ของลมหายใจในการเดินทางให้จบ
                
                if (globalBreath > d.karmaDelay * activeRange) {
                    lifeProgress = (globalBreath - (d.karmaDelay * activeRange)) / activeRange;
                    lifeProgress = Math.min(1, Math.max(0, lifeProgress));
                }

                // ดัดกราฟให้เคลื่อนที่แบบพุ่งออกแล้วหน่วงตอนปลาย (Ease-Out)
                let easeProgress = 1 - Math.pow(1 - lifeProgress, 3);

                // เคลื่อนที่ตาม "เส้นกรรม" (Bezier Curve)
                let currentPos = getBezierPoint(easeProgress, d.origin, d.control, d.target);

                // หากเป็นน้ำ ให้กระเพื่อมตามคลื่น
                if (d.color.getHex() === Palette.water && easeProgress === 1) {
                    currentPos.y += Math.sin((time * 2) + currentPos.x) * 0.3;
                }

                // ขนาดของเซลล์ (เติบโตตอนเดินทาง)
                let scale = (lifeProgress > 0) ? 0.3 + (lifeProgress * 0.7) : 0.001;

                dummy.position.copy(currentPos);
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                instancedCells.setMatrixAt(i, dummy.matrix);
                
                // ให้เซลล์ส่องแสงสว่างขึ้นเมื่อถึงเป้าหมาย
                if (easeProgress > 0.8) {
                    instancedCells.setColorAt(i, d.color);
                } else {
                    instancedCells.setColorAt(i, new THREE.Color(Palette.origin));
                }
            }
            instancedCells.instanceMatrix.needsUpdate = true;
            instancedCells.instanceColor.needsUpdate = true;

            // หมุนกล้องอย่างช้าๆ สง่างาม
            camera.position.x = Math.sin(time * 0.1) * 20;
            camera.position.z = 40 + Math.cos(time * 0.1) * 15;
            camera.lookAt(0, 5, 0);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
