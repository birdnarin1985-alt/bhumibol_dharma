<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OS เจตจำนง | Mirror Graph & Yonisomanasikara</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif;
            overflow: hidden; width: 100vw; height: 100vh; touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI พื้นฐานของ OS */
        .os-ui {
            position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 40px 20px;
        }
        
        .status-hud {
            background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 16px 40px; border-radius: 50px; text-align: center; font-family: 'Prompt', sans-serif;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); transition: all 0.5s ease;
        }
        
        #hud-title { color: #38bdf8; font-size: 1.1rem; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
        #hud-sub { color: #fbbf24; display: block; margin-top: 6px; font-size: 0.9rem; font-weight: 300; }

        /* ช่องรับเจตจำนง (คำสั่งภาษาไทย) */
        .intent-box {
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(251, 191, 36, 0.5);
            padding: 10px 20px; border-radius: 30px; display: flex; gap: 15px;
            pointer-events: auto; width: 90%; max-width: 600px;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.1); backdrop-filter: blur(10px);
        }
        
        .intent-box input {
            background: transparent; border: none; color: #f8fafc; font-family: 'Prompt', sans-serif;
            font-size: 1rem; width: 100%; outline: none; text-align: center;
        }
        .intent-box input::placeholder { color: rgba(248, 250, 252, 0.3); }
        
        .glass-btn {
            background: rgba(251, 191, 36, 0.2); border: 1px solid rgba(251, 191, 36, 0.8);
            color: #fbbf24; border-radius: 20px; padding: 8px 20px; cursor: pointer;
            font-family: 'Prompt', sans-serif; font-weight: 600; transition: 0.3s;
        }
        .glass-btn:hover { background: rgba(251, 191, 36, 0.5); color: #fff; box-shadow: 0 0 10px #fbbf24; }

    </style>
</head>
<body>

    <div class="os-ui">
        <div class="status-hud" id="status-hud">
            <div id="hud-title">สุญญตา (IDLE)</div>
            <span id="hud-sub">รอรับเจตจำนง...</span>
        </div>

        <div class="intent-box">
            <input type="text" id="intent-input" placeholder="บอกสิ่งที่ต้องการ เช่น 'สร้างระบบเก็บข้อมูลลูกค้า'" autocomplete="off">
            <button class="glass-btn" onclick="processIntent()">ส่งเจตจำนง</button>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // สีประจำการทำงาน (Palette)
        const P = { void: 0x020617, idle: 0x64748b, core: 0xfbbf24, mirror: 0x38bdf8, pointer: 0x10b981 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(P.void);
        scene.fog = new THREE.FogExp2(P.void, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.5, 100);
        light.position.set(0, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // จำนวน Voxel 
        const cellCount = 4000; 
        const voxelGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const voxelMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, metalness: 0.1, roughness: 0.2, transmission: 0.5, thickness: 0.5
        });
        
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        // ตัวแปรเก็บตำแหน่ง
        const dummy = new THREE.Object3D();
        const cellData = [];
        let systemState = 0; // 0=Idle, 1=Yonisomanasikara (Thinking), 2=Mirror Graph, 3=Sampatichami

        // สร้างฝุ่นละอองแบบสุญญตา (ค่าเริ่มต้น)
        for (let i = 0; i < cellCount; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            let r = 15 + Math.random() * 20;

            let idlePos = new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            
            // ตำแหน่งโครงสร้าง Graph สะท้อน
            let targetPos = new THREE.Vector3();
            let roleColor = new THREE.Color(P.idle);

            cellData.push({ 
                current: idlePos.clone(), 
                idle: idlePos, 
                target: targetPos, 
                color: roleColor,
                speed: 0.02 + Math.random() * 0.03
            });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];

                if (systemState === 0) {
                    // IDLE: ลอยวนไปมาแบบสุญญตา
                    d.current.x = d.idle.x + Math.sin(time * 0.5 + i) * 2;
                    d.current.y = d.idle.y + Math.cos(time * 0.3 + i) * 2;
                    d.current.z = d.idle.z + Math.sin(time * 0.4 + i) * 2;
                    instancedVoxels.setColorAt(i, new THREE.Color(P.idle));
                } else if (systemState >= 1) {
                    // เคลื่อนตัวเข้าหาเป้าหมาย
                    d.current.lerp(d.target, d.speed);
                    instancedVoxels.setColorAt(i, d.color);
                }

                dummy.position.copy(d.current);
                
                // ให้ Voxel หมุนรอบตัวเอง
                if(systemState > 0) {
                    dummy.rotation.set(time * 2, time * 2, 0);
                } else {
                    dummy.rotation.set(time * 0.2, time * 0.2, 0);
                }

                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
            }
            
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;
            
            // มุมกล้องหมุนช้าๆ รอบแกน Y
            camera.position.x = Math.sin(time * 0.2) * 45;
            camera.position.z = Math.cos(time * 0.2) * 45;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // ---- ระบบจำลองการประมวลผล (AI OS Simulation) ----
        const inputField = document.getElementById('intent-input');
        
        // รับคำสั่งเมื่อกด Enter
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") processIntent();
        });

        function processIntent() {
            let intent = inputField.value.trim();
            if(!intent) return;
            
            inputField.value = "";
            inputField.blur();

            // ขั้นที่ 1: โยนิโสมนสิการ (รวบรวมข้อมูลเพื่อวิเคราะห์รากฐาน)
            systemState = 1;
            updateHUD("โยนิโสมนสิการ (Analyzing)", `พิจารณาเจตจำนง: "${intent}"`, "#fbbf24");
            
            // ดึงอนุภาคทั้งหมดมารวมศูนย์กลางชั่วคราว (การคิด)
            for (let i = 0; i < cellCount; i++) {
                cellData[i].target.set(
                    (Math.random() - 0.5) * 5, 
                    (Math.random() - 0.5) * 5, 
                    (Math.random() - 0.5) * 5
                );
                cellData[i].color.setHex(0xffffff);
            }

            // ขั้นที่ 2: สร้างโครงสร้าง Mirror Graph ด้วย Pointer
            setTimeout(() => {
                systemState = 2;
                updateHUD("Mirror Graph Structure", "ถักทอโครงสร้างพอยน์เตอร์สะท้อน", "#38bdf8");
                buildMirrorGraph();
            }, 3000);

            // ขั้นที่ 3: สัมปติจฉามิ (ล็อกโครงสร้างสำเร็จ)
            setTimeout(() => {
                systemState = 3;
                updateHUD("สัมปติจฉามิ (Success)", "โครงสร้างเจตจำนงถูกล็อกลงระบบ (Voxel Interlock)", "#10b981");
                
                // ให้แสงสว่างวาบขึ้น
                light.intensity = 5;
                setTimeout(() => light.intensity = 1.5, 1000);
            }, 6000);
        }

        function buildMirrorGraph() {
            // จัดเรียง Voxel เป็นรูปทรง Graph: Node กลาง 1, Node กระจกซ้าย-ขวา, และเส้น Pointer
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let type = Math.random();

                if (i < 500) { 
                    // แกนกลาง (Root Node / ปฐมธาตุ)
                    d.target.set((Math.random() - 0.5)*4, (Math.random() - 0.5)*4, (Math.random() - 0.5)*4);
                    d.color.setHex(P.core);
                } 
                else if (i < 1200) { 
                    // Mirror Node 1 (ซ้าย)
                    d.target.set(-15 + (Math.random() - 0.5)*3, 5 + (Math.random() - 0.5)*3, (Math.random() - 0.5)*3);
                    d.color.setHex(P.mirror);
                }
                else if (i < 1900) { 
                    // Mirror Node 2 (ขวา)
                    d.target.set(15 + (Math.random() - 0.5)*3, -5 + (Math.random() - 0.5)*3, (Math.random() - 0.5)*3);
                    d.color.setHex(P.mirror);
                }
                else if (i < 2950) { 
                    // เส้น Pointer สะท้อนซ้าย (Karma Path)
                    let t = (i - 1900) / 1050; // 0 to 1
                    d.target.set(0 * (1-t) + -15 * t + (Math.random()-0.5)*0.5, 
                                 0 * (1-t) + 5 * t + (Math.random()-0.5)*0.5, 
                                 0);
                    d.color.setHex(P.pointer);
                }
                else { 
                    // เส้น Pointer สะท้อนขวา (Karma Path)
                    let t = (i - 2950) / 1050; // 0 to 1
                    d.target.set(0 * (1-t) + 15 * t + (Math.random()-0.5)*0.5, 
                                 0 * (1-t) + -5 * t + (Math.random()-0.5)*0.5, 
                                 0);
                    d.color.setHex(P.pointer);
                }
            }
        }

        function updateHUD(title, sub, color) {
            document.getElementById('hud-title').innerText = title;
            document.getElementById('hud-title').style.color = color;
            document.getElementById('hud-sub').innerText = sub;
            document.getElementById('status-hud').style.borderColor = color;
            document.getElementById('status-hud').style.boxShadow = `0 0 20px ${color}40`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
