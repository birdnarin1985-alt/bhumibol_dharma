<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Dharma Engine | เขื่อนภูมิพล 8-Bit Blueprint</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        /* Pure UX Minimalist HUD - ใสปิ๊ง สไตล์บลูปรินท์ 8 บิต */
        .pure-hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 12px 26px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #38bdf8;
            font-family: 'Prompt', sans-serif;
            pointer-events: none;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            text-align: center;
        }
        .pure-hud span {
            color: #fbbf24;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="pure-hud" id="hud-text">
        ⚡ <span>[8-Bit Blueprint]</span> แตะหน้าจอเพื่อวาร์ปทะลุมิติผ่านชั้นธาตุ
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SEMANTIC PALETTE & QUANTUM REGISTRY (8-Bit Indexed Style) ---
        const Palette8Bit = {
            earth: 0x064e3b,   // ปฐวีธาตุ (เขียวมรกตเข้ม)
            water: 0x0284c7,   // อาโปธาตุ (ฟ้าบลูปรินท์)
            steel: 0x64748b,   // โครงสร้างคอนกรีต
            gold: 0xfbbf24,    // เตโชธาตุ / พลังงาน (ทองคำ)
            cyan: 0x38bdf8     // วาโยธาตุ / สัญญาณควอนตัม
        };

        const QuantumRegistry = {
            currentLayer: 0,
            layersInfo: [
                "มหภาค (Semantic Landscape & Arch Dam): ปฐวีธาตุ + อาโปธาตุ (อ้างอิงภาพถ่ายต้นแบบ)",
                "โครงสร้างเหล็กเสริม (Semantic Rebar Graph): ปฐวีธาตุขันธ์ (เหล็ก Fe - สติและศรัทธา)",
                "ระดับเซลล์จิต (Cellular Mind Mesh): อาโปธาตุ + วาโยธาตุ (เครือข่ายขันธ์ 5)",
                "ระดับอะตอมปรมัตถ์ (Atomic Core & Elements): เตโชธาตุ + ความว่างเปล่า (อนัตตา)"
            ]
        };

        // --- 2. SETUP SCENE & CAMERA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);
        scene.fog = new THREE.FogExp2(0x020617, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 46);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); // ปิด antialias เล็กน้อยให้ได้กลิ่นอาย 8-Bit Pixel Art
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. LIGHTING (Flat 8-Bit Blueprint Style) ---
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(Palette8Bit.gold, 2.0);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- 4. LAYER GROUPS ---
        const macroGroup = new THREE.Group();     
        const rebarGroup = new THREE.Group();     
        const cellularGroup = new THREE.Group();  
        const atomicGroup = new THREE.Group();    

        scene.add(macroGroup);
        scene.add(rebarGroup);
        scene.add(cellularGroup);
        scene.add(atomicGroup);

        // --- LAYER 0: SEMANTIC MACRO (Landscape & Arch Dam อ้างอิงจากภาพถ่าย[span_1](start_span)[span_1](end_span)) ---
        // ภูเขาซ้าย-ขวา โอบล้อมอ่างเก็บน้ำ
        const terrainMat = new THREE.MeshLambertMaterial({ color: Palette8Bit.earth, flatShading: true });
        
        const mLeft = new THREE.Mesh(new THREE.ConeGeometry(24, 28, 4), terrainMat);
        mLeft.position.set(-20, -3, -4);
        macroGroup.add(mLeft);

        const mRight = new THREE.Mesh(new THREE.ConeGeometry(26, 32, 4), terrainMat);
        mRight.position.set(20, -3, -4);
        macroGroup.add(mRight);

        // เขื่อนโค้งคอนกรีต (Arch Dam) รับแรงดันน้ำ
        const damGeo = new THREE.CylinderGeometry(15, 12, 16, 16, 1, true, 0, Math.PI);
        const damMat = new THREE.MeshLambertMaterial({ color: Palette8Bit.steel, side: THREE.DoubleSide, flatShading: true });
        const archDam = new THREE.Mesh(damGeo, damMat);
        archDam.rotation.y = Math.PI / 2;
        archDam.position.set(0, 1, 0);
        macroGroup.add(archDam);

        // มวลน้ำเหนืออ่างเก็บน้ำ (อาโปธาตุ)
        const waterGeo = new THREE.PlaneGeometry(40, 30, 8, 8);
        const waterMat = new THREE.MeshBasicMaterial({ color: Palette8Bit.water, wireframe: true });
        const waterBody = new THREE.Mesh(waterGeo, waterMat);
        waterBody.rotation.x = -Math.PI / 2;
        waterBody.position.set(0, 0, 8);
        macroGroup.add(waterBody);


        // --- LAYER 1: REBAR SKELETON (โครงข่ายเหล็กเสริมพอยต์เตอร์) ---
        const rebarGeo = new THREE.BufferGeometry();
        const rebarPositions = [];
        for (let i = 0; i < 120; i++) {
            let theta = (i / 120) * Math.PI;
            let x = Math.cos(theta) * 13;
            let z = Math.sin(theta) * 13;
            rebarPositions.push(x, -6, z, x, 8, z);
        }
        rebarGeo.setAttribute('position', new THREE.Float32BufferAttribute(rebarPositions, 3));
        const rebarMesh = new THREE.LineSegments(rebarGeo, new THREE.LineBasicMaterial({ color: Palette8Bit.gold }));
        rebarGroup.add(rebarMesh);
        rebarGroup.visible = false;


        // --- LAYER 2: CELLULAR MIND MESH (เครือข่ายเซลล์และขันธ์ 5) ---
        const cellCount = 100;
        const cellularInstanced = new THREE.InstancedMesh(
            new THREE.BoxGeometry(0.4, 0.4, 0.4), // 8-Bit Voxel Style
            new THREE.MeshBasicMaterial({ color: Palette8Bit.cyan }),
            cellCount
        );
        const dummy = new THREE.Object3D();
        const cellData = [];
        for (let i = 0; i < cellCount; i++) {
            let u = Math.random() * Math.PI, v = Math.random() * Math.PI * 2, r = 8 + Math.random() * 3;
            let x = r * Math.sin(u) * Math.cos(v);
            let y = r * Math.cos(u) + 1;
            let z = r * Math.sin(u) * Math.sin(v);
            cellData.push({ x, y, z, vx: (Math.random()-0.5)*0.02, vy: (Math.random()-0.5)*0.02 });
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            cellularInstanced.setMatrixAt(i, dummy.matrix);
        }
        cellularGroup.add(cellularInstanced);
        cellularGroup.visible = false;


        // --- LAYER 3: ATOMIC CORE (ระดับอะตอม & ปรมัตถสัจจะ) ---
        const atomCore = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshBasicMaterial({ color: Palette8Bit.gold }));
        atomicGroup.add(atomCore);
        for(let j = 1; j <= 3; j++) {
            let orbit = new THREE.Mesh(
                new THREE.RingGeometry(j * 3.0 - 0.05, j * 3.0 + 0.05, 12),
                new THREE.MeshBasicMaterial({ color: Palette8Bit.cyan, side: THREE.DoubleSide })
            );
            orbit.rotation.x = Math.PI / 2 + j * 0.6;
            atomicGroup.add(orbit);
        }
        atomicGroup.visible = false;


        // --- PURE UX: TOUCH-TO-TOGGLE QUANTUM WARP ---
        window.addEventListener('click', handleToggleWarp);
        window.addEventListener('touchstart', handleToggleWarp);

        function handleToggleWarp(e) {
            e.preventDefault();
            QuantumRegistry.currentLayer = (QuantumRegistry.currentLayer + 1) % 4;
            updateLayerState();
        }

        function updateLayerState() {
            let layer = QuantumRegistry.currentLayer;
            macroGroup.visible = (layer === 0);
            rebarGroup.visible = (layer === 1);
            cellularGroup.visible = (layer === 2);
            atomicGroup.visible = (layer === 3);

            document.getElementById('hud-text').innerHTML = `
                ⚡ <span>[ชั้นที่ ${layer + 1}/4]</span> ${QuantumRegistry.layersInfo[layer]}
            `;
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let elapsedTime = clock.getElapsedTime();

            let targetZ = 46 - QuantumRegistry.currentLayer * 13;
            camera.position.z += (targetZ - camera.position.z) * 0.08;
            camera.lookAt(0, 0, 0);

            if (QuantumRegistry.currentLayer === 0) {
                waterBody.position.z = 8 + Math.sin(elapsedTime * 3) * 0.2;
            } else if (QuantumRegistry.currentLayer === 1) {
                rebarGroup.rotation.y = elapsedTime * 0.2;
            } else if (QuantumRegistry.currentLayer === 2) {
                for (let i = 0; i < cellCount; i++) {
                    let d = cellData[i];
                    d.x += d.vx; d.y += d.vy;
                    dummy.position.set(d.x, d.y, d.z);
                    dummy.updateMatrix();
                    cellularInstanced.setMatrixAt(i, dummy.matrix);
                }
                cellularInstanced.instanceMatrix.needsUpdate = true;
            } else if (QuantumRegistry.currentLayer === 3) {
                atomicGroup.rotation.y = elapsedTime * 0.4;
                atomicGroup.rotation.z = elapsedTime * 0.25;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
