<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Dharma Engine | The Breath of Universe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        /* Pure UX - สะอาดตาที่สุด แสดงเพียงสภาวะของลมหายใจ */
        .pure-hud {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 0.95rem;
            color: #38bdf8;
            font-family: 'Prompt', sans-serif;
            pointer-events: none;
            letter-spacing: 1px;
            text-align: center;
            transition: all 1s ease-in-out;
        }
        .pure-hud span {
            color: #fbbf24;
            font-weight: 600;
            display: block;
            margin-top: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="pure-hud" id="hud-text">
        สภาวะว่างเปล่า (สุญญตา)
        <span id="sub-text">...</span>
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. 16-BIT INDEXED BLUEPRINT PALETTE ---
        const Palette16 = {
            earthLight: 0x064e3b,
            waterBright: 0x0284c7,
            steelCore: 0x475569, 
            goldBright: 0xfbbf24,
            cyanBright: 0x38bdf8 
        };

        const colorsArray = [
            new THREE.Color(Palette16.cyanBright),
            new THREE.Color(Palette16.goldBright),
            new THREE.Color(Palette16.waterBright),
            new THREE.Color(Palette16.earthLight)
        ];

        // --- 2. SETUP SCENE & CAMERA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. LIGHTING (ผูกกับลมหายใจ) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(Palette16.goldBright, 0);
        dirLight.position.set(25, 45, 25);
        scene.add(dirLight);

        // --- 4. MACRO STRUCTURE (เขื่อนและภูเขา) ---
        const macroGroup = new THREE.Group();
        scene.add(macroGroup);

        const terrainMat = new THREE.MeshLambertMaterial({ color: Palette16.earthLight, flatShading: true, transparent: true, opacity: 0 });
        const mLeft = new THREE.Mesh(new THREE.ConeGeometry(24, 28, 6), terrainMat);
        mLeft.position.set(-20, -3, -4);
        macroGroup.add(mLeft);

        const mRight = new THREE.Mesh(new THREE.ConeGeometry(26, 32, 6), terrainMat);
        mRight.position.set(20, -3, -4);
        macroGroup.add(mRight);

        const damMat = new THREE.MeshLambertMaterial({ color: Palette16.steelCore, side: THREE.DoubleSide, flatShading: true, transparent: true, opacity: 0 });
        const archDam = new THREE.Mesh(new THREE.CylinderGeometry(15, 12, 16, 28, 1, true, 0, Math.PI), damMat);
        archDam.rotation.y = Math.PI / 2;
        archDam.position.set(0, 1, 0);
        macroGroup.add(archDam);

        const waterMat = new THREE.MeshBasicMaterial({ color: Palette16.waterBright, wireframe: true, transparent: true, opacity: 0 });
        const waterBody = new THREE.Mesh(new THREE.PlaneGeometry(40, 30, 16, 16), waterMat);
        waterBody.rotation.x = -Math.PI / 2;
        waterBody.position.set(0, 0, 8);
        macroGroup.add(waterBody);

        // --- 5. SPHERICAL MITOSIS (กลุ่มเซลล์อะตอม 1600 จุด) ---
        const cellCount = 1600;
        const sphereGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const sphereMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x000000, transparent: true, opacity: 0.8 });
        const instancedCells = new THREE.InstancedMesh(sphereGeo, sphereMat, cellCount);
        scene.add(instancedCells);

        const dummy = new THREE.Object3D();
        const cellData = [];

        for (let i = 0; i < cellCount; i++) {
            // ตำแหน่งโครงสร้างเมื่อสมบูรณ์ (Structured)
            let u = Math.random() * Math.PI, v = Math.random() * Math.PI * 2, r = 3 + Math.random() * 12;
            let targetX = r * Math.sin(u) * Math.cos(v);
            let targetY = r * Math.cos(u) + 3;
            let targetZ = r * Math.sin(u) * Math.sin(v);

            // ตำแหน่งเมื่อสลายตัว/ว่างเปล่า (Void / Random)
            let voidX = (Math.random() - 0.5) * 150;
            let voidY = (Math.random() - 0.5) * 150;
            let voidZ = (Math.random() - 0.5) * 150;

            cellData.push({
                target: new THREE.Vector3(targetX, targetY, targetZ),
                void: new THREE.Vector3(voidX, voidY, voidZ),
                current: new THREE.Vector3(voidX, voidY, voidZ),
                color: colorsArray[i % colorsArray.length],
                speed: 0.02 + Math.random() * 0.03
            });

            instancedCells.setColorAt(i, cellData[i].color);
        }
        instancedCells.instanceColor.needsUpdate = true;

        // --- 6. THE BREATHING LOOP (อานาปานสติ & พลศาสตร์การแบ่งเซลล์) ---
        const clock = new THREE.Clock();
        const hudText = document.getElementById('hud-text');
        const subText = document.getElementById('sub-text');

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // จังหวะลมหายใจ (รอบละประมาณ 12 วินาที)
            // คลื่น Sine จะวิ่งจาก -1 ถึง 1 เราปรับให้เป็น 0.0 ถึง 1.0 (0=ว่างเปล่า, 1=สมบูรณ์)
            let breath = (Math.sin(time * 0.5) + 1) / 2; 

            // อัปเดต HUD ตามจังหวะลมหายใจ
            if (breath < 0.15) {
                hudText.childNodes[0].nodeValue = "สภาวะว่างเปล่า (สุญญตา)";
                subText.innerText = "...คืนสู่จุดกำเนิด...";
                hudText.style.opacity = "0.3";
            } else if (breath > 0.15 && breath < 0.85) {
                let status = (Math.cos(time * 0.5) < 0) ? "ก่อกำเนิด (หายใจเข้า)" : "สลายตัว (หายใจออก)";
                hudText.childNodes[0].nodeValue = status;
                subText.innerText = "การรวมตัวของมหาภูตรูป ๔ และแรงกรรม";
                hudText.style.opacity = "0.8";
            } else {
                hudText.childNodes[0].nodeValue = "ตั้งมั่น (สถิตยภูมิ)";
                subText.innerText = "รูปขันธ์สมบูรณ์ปรากฏชั่วขณะ";
                hudText.style.opacity = "1.0";
            }

            // 1. ความสว่างของแสง (ล้อตามลมหายใจ)
            ambientLight.intensity = 0.2 + (breath * 1.5);
            dirLight.intensity = breath * 3.0;

            // 2. การเกิดดับของเขื่อนและภูเขา (ค่อยๆ ปรากฏเมื่อ breath > 0.5)
            let macroOpacity = Math.max(0, (breath - 0.5) * 2);
            terrainMat.opacity = macroOpacity;
            damMat.opacity = macroOpacity;
            waterMat.opacity = macroOpacity * 0.5; // น้ำโปร่งแสง
            waterBody.position.z = 8 + Math.sin(time * 4) * 0.25;

            // 3. เซลล์ Mitosis วิ่งเข้าหากันหรือกระจายตัวตามลมหายใจ
            // ใช้ฟังก์ชัน Lerp (Linear Interpolation) ดึงอนุภาคจาก Void สู่ Target
            let smoothBreath = Math.pow(breath, 1.5); // ทำให้การวิ่งดูมีมิติและสมูทขึ้น
            
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                
                // ให้เซลล์จำนวนหนึ่งค่อยๆ ปรากฏขึ้นตามเปอร์เซ็นต์ของลมหายใจ
                let isAlive = (i / cellCount) < breath; 
                let scale = isAlive ? (0.5 + breath * 0.5) : 0.001;

                // วิ่งสลับระหว่างความว่างเปล่า กับ โครงสร้างที่สมบูรณ์
                d.current.lerpVectors(d.void, d.target, smoothBreath);

                // เพิ่มการไหวระรอกแบบเซลล์สิ่งมีชีวิต
                if (isAlive) {
                    d.current.x += Math.sin(time * 3 + i) * 0.05 * breath;
                    d.current.y += Math.cos(time * 3 + i) * 0.05 * breath;
                }

                dummy.position.copy(d.current);
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                instancedCells.setMatrixAt(i, dummy.matrix);
            }
            instancedCells.instanceMatrix.needsUpdate = true;

            // หมุนกล้องเล็กน้อยให้ดูอลังการ
            camera.position.x = Math.sin(time * 0.2) * 15;
            camera.position.z = 45 + Math.cos(time * 0.2) * 10;
            camera.lookAt(0, 2, 0);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
