<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dharma Truck OS | โยนิโส คัมภีร์คาถาอัจฉริยะ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif;
            overflow: hidden; width: 100vw; height: 100vh; touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD ระบบรถบรรทุกธรรมะ */
        .os-ui {
            position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px 15px;
        }
        
        .status-hud {
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(251, 191, 36, 0.5);
            padding: 12px 25px; border-radius: 40px; text-align: center; font-family: 'Prompt', sans-serif;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.2); max-width: 90%; pointer-events: auto;
        }
        
        #hud-title { color: #fbbf24; font-size: 1rem; letter-spacing: 1px; font-weight: 600; }
        #hud-sub { color: #38bdf8; display: block; margin-top: 2px; font-size: 0.8rem; font-weight: 300; }

        /* แผงควบคุมคีย์ลัดคาถา (Magic Deck) */
        .control-panel {
            background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(56, 189, 248, 0.6);
            padding: 15px; border-radius: 30px; display: flex; flex-direction: column; gap: 10px;
            pointer-events: auto; width: 100%; max-width: 550px; align-items: center;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.3); backdrop-filter: blur(15px);
        }

        .speech-display {
            width: 100%; background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px; border-radius: 18px; text-align: center; font-family: 'Prompt', sans-serif;
            font-size: 1.05rem; color: #fbbf24; min-height: 48px; display: flex; align-items: center; justify-content: center;
            letter-spacing: 1px; word-break: break-all;
        }
        .speech-display span { color: rgba(248, 250, 252, 0.4); font-style: italic; font-size: 0.85rem; }

        /* หมวดหมู่คีย์ลัดแบ่งสีชัดเจน */
        .shortcut-section {
            width: 100%; display: flex; flex-direction: column; gap: 6px;
        }
        .section-label {
            font-size: 0.75rem; font-family: 'Prompt', sans-serif; color: rgba(248, 250, 252, 0.7);
            padding-left: 5px; display: flex; justify-content: space-between;
        }
        .btn-row {
            display: flex; gap: 8px; width: 100%; justify-content: center;
        }

        /* ปุ่มตามหมวดหมู่สี */
        .shortcut-btn {
            border-radius: 14px; padding: 10px 12px; cursor: pointer; font-family: 'Prompt', sans-serif;
            font-weight: 600; font-size: 0.9rem; transition: 0.2s; flex: 1; text-align: center; border: 1px solid;
            touch-action: manipulation;
        }
        .shortcut-btn:active { transform: scale(0.95); filter: brightness(1.4); }

        /* ประธาน (สีฟ้า) */
        .btn-subject { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.7); color: #38bdf8; }
        /* กรรม (สีเขียว) */
        .btn-object { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.7); color: #34d399; }
        /* กริยา / คาถา (สีทอง) */
        .btn-verb { background: rgba(251, 191, 36, 0.2); border-color: rgba(251, 191, 36, 0.7); color: #fbbf24; }
        /* ล้างจิต (สีม่วง) */
        .btn-clean { background: rgba(168, 85, 247, 0.25); border-color: rgba(168, 85, 247, 0.9); color: #c084fc; }
        /* สัมปติจฉามิ (สีฟ้าสว่าง/รันผล) */
        .btn-execute { background: rgba(56, 189, 248, 0.35); border-color: #38bdf8; color: #fff; box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }

        .mic-btn {
            background: rgba(239, 68, 68, 0.25); border: 1px solid rgba(239, 68, 68, 0.9);
            color: #ef4444; border-radius: 14px; padding: 10px 15px; cursor: pointer; transition: 0.2s;
            font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 5px;
            touch-action: manipulation; flex: 1;
        }
        .mic-btn.listening { background: rgba(239, 68, 68, 0.8); color: #fff; box-shadow: 0 0 15px #ef4444; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="os-ui">
        <div class="status-hud" id="status-hud">
            <div id="hud-title">สุญญตา & ปฐมธาตุ (รถบรรทุกพร้อม)</div>
            <span id="hud-sub">เลือกคีย์ลัดคาถาตามหมวดหมู่ แล้วกด "สัมปติจฉามิ"</span>
        </div>

        <div class="control-panel">
            <!-- จอแสดงผลคาถาที่ประกอบ -->
            <div class="speech-display" id="spell-builder-display">
                <span>(แตะปุ่มคีย์ลัดด้านล่างเพื่อร้อยเรียงคาถา)</span>
            </div>
            
            <!-- หมวดที่ 1: ประธาน (Subject - สีฟ้า) -->
            <div class="shortcut-section">
                <div class="section-label"><span>หมวดประธาน (Subject)</span><span style="color:#38bdf8">■ สีฟ้า</span></div>
                <div class="btn-row">
                    <button class="shortcut-btn btn-subject" onclick="appendSpell('จิตฺต')">จิตฺต</button>
                    <button class="shortcut-btn btn-subject" onclick="appendSpell('อัตตา')">อัตตา</button>
                </div>
            </div>

            <!-- หมวดที่ 2: กรรม (Object - สีเขียว) -->
            <div class="shortcut-section">
                <div class="section-label"><span>หมวดกรรม (Object - ข้อมูล)</span><span style="color:#34d399">■ สีเขียว</span></div>
                <div class="btn-row">
                    <button class="shortcut-btn btn-object" onclick="appendSpell('ธมฺม')">ธมฺม (ธรรมะ)</button>
                    <button class="shortcut-btn btn-object" onclick="appendSpell('โยค')">โยค (พอเพียง)</button>
                    <button class="shortcut-btn btn-object" onclick="appendSpell('ญาณ')">ญาณ (ความรู้)</button>
                </div>
            </div>

            <!-- หมวดที่ 3: กริยา / คาถา (Verb/Spell - สีทอง) -->
            <div class="shortcut-section">
                <div class="section-label"><span>หมวดกริยา / คาถา (Action)</span><span style="color:#fbbf24">■ สีทอง</span></div>
                <div class="btn-row">
                    <button class="shortcut-btn btn-verb" onclick="appendSpell('นิปปัตติ')">นิปปัตติ (สร้าง)</button>
                    <button class="shortcut-btn btn-verb" onclick="appendSpell('ปฏิจจะ')">ปฏิจจะ (เชื่อมโยง)</button>
                    <button class="shortcut-btn btn-verb" onclick="appendSpell('สัตติ')">สัตติ (ตรวจสติ)</button>
                </div>
            </div>

            <!-- แผงควบคุมพิเศษ: ล้างจิต และ สัมปติจฉามิ -->
            <div class="btn-row" style="margin-top: 5px;">
                <button class="mic-btn" id="mic-toggle-btn" onclick="toggleSpeechRecognition()">🎙️ พูด</button>
                <button class="shortcut-btn btn-clean" onclick="cleanMind()">โสธะนัม</button>
                <button class="shortcut-btn btn-execute" onclick="processIntent()">สัมปติจฉามิ</button>
            </div>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const P = { void: 0x020617, idle: 0x475569, dharma: 0xfbbf24, sufficiency: 0x10b981, pointer: 0x38bdf8 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(P.void);
        scene.fog = new THREE.FogExp2(P.void, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.5, 100);
        light.position.set(0, 25, 15);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2.5));

        const cellCount = 3000; 
        const voxelGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const voxelMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, metalness: 0.1, roughness: 0.2, transmission: 0.4, thickness: 0.5
        });
        
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        const dummy = new THREE.Object3D();
        const cellData = [];
        let systemState = 0; 
        let currentSpellArray = [];

        for (let i = 0; i < cellCount; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            let r = 16 + Math.random() * 18;
            let idlePos = new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            
            cellData.push({ 
                current: idlePos.clone(), 
                idle: idlePos, 
                target: new THREE.Vector3(), 
                color: new THREE.Color(P.idle),
                speed: 0.02 + Math.random() * 0.03
            });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];

                if (systemState === 0) {
                    d.current.x = d.idle.x + Math.sin(time * 0.4 + i) * 1.5;
                    d.current.y = d.idle.y + Math.cos(time * 0.3 + i) * 1.5;
                    d.current.z = d.idle.z + Math.sin(time * 0.35 + i) * 1.5;
                    instancedVoxels.setColorAt(i, new THREE.Color(P.idle));
                } else {
                    d.current.lerp(d.target, d.speed);
                    instancedVoxels.setColorAt(i, d.color);
                }

                dummy.position.copy(d.current);
                dummy.rotation.set(time * (systemState > 0 ? 1 : 0.2), time * 0.5, 0);
                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
            }
            
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;
            
            camera.position.x = Math.sin(time * 0.15) * 40;
            camera.position.z = Math.cos(time * 0.15) * 40;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // ---- ฟังก์ชันประกอบคาถาจากปุ่มคีย์ลัด (แก้ไข Syntax ให้ถูกต้องแล้ว) ----
        function appendSpell(word) {
            currentSpellArray.push(word);
            let spellStr = currentSpellArray.join(" ");
            document.getElementById('spell-builder-display').innerHTML = `<b>${spellStr}</b>`;
        }

        // ---- ระบบแปลงเสียงพูด ----
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('mic-toggle-btn').classList.add('listening');
                updateHUD("กำลังสดับรับฟัง...", "โปรดเอ่ยคาถาภาษาโยนิโส", "#ef4444");
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                currentSpellArray = [transcript];
                document.getElementById('spell-builder-display').innerHTML = `<b>${transcript}</b>`;
            };

            recognition.onerror = function(event) { stopListening(); };
            recognition.onend = function() { stopListening(); };
        }

        function toggleSpeechRecognition() {
            if (!recognition) { alert("เบราว์เซอร์ไม่รองรับเสียงพูด"); return; }
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function stopListening() {
            isListening = false;
            document.getElementById('mic-toggle-btn').classList.remove('listening');
        }

        // ---- ฟังก์ชัน "ล้างจิต" (โสธะนัม) ----
        function cleanMind() {
            currentSpellArray = [];
            document.getElementById('spell-builder-display').innerHTML = `<span>(ล้างจิตแล้ว... เลือกคีย์ลัดคาถาใหม่)</span>`;
            systemState = 0;
            updateHUD("โสธะนัม (ล้างจิตสำเร็จ)", "จิตว่างเปล่า พร้อมร้อยเรียงคาถาใหม่", "#c084fc");
            
            light.color.setHex(0xc084fc);
            light.intensity = 3;
            setTimeout(() => { light.color.setHex(0xffffff); light.intensity = 1.5; }, 600);
        }

        // ---- ประมวลผลคาถา (สัมปติจฉามิ) ----
        function processIntent() {
            let spell = currentSpellArray.join(" ").trim().toLowerCase();
            if(!spell) {
                updateHUD("จิตยังว่างเปล่า", "โปรดเลือกคาถาก่อนกด 'สัมปติจฉามิ'", "#ef4444");
                return;
            }

            systemState = 1;
            updateHUD("โยนิโสมนสิการ (พิจารณาที่มา)", `พิจารณาคาถา: "${spell}"`, "#fbbf24");
            
            for (let i = 0; i < cellCount; i++) {
                cellData[i].target.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                cellData[i].color.setHex(0xffffff);
            }

            setTimeout(() => {
                systemState = 2;
                
                if (spell.includes("ธมฺม") || spell.includes("ธรรมะ")) {
                    updateHUD("คาถา: บรรทุกธรรมะหลวงพ่อฤาษีฯ", "สร้าง Mirror Pointer สู่ความหลุดพ้น", "#fbbf24");
                    buildDharmaStructure();
                } else if (spell.includes("โยค") || spell.includes("พอเพียง")) {
                    updateHUD("คาถา: ปรัชญาเศรษฐกิจพอเพียง", "สร้างโครงสร้างรูปขันธ์ความมั่นคง", "#10b981");
                    buildSufficiencyStructure();
                } else if (spell.includes("สัตติ") || spell.includes("ตรวจ")) {
                    updateHUD("สัตติ (System Check)", "ระบบเสถียร สมบูรณ์ พร้อมรับใช้ประชาชน", "#38bdf8");
                    buildAwarenessStructure();
                } else {
                    updateHUD("สัมปติจฉามิ (สำเร็จตามเจตจำนง)", `ฝังคาถา "${spell}" ลงฮาร์ดแวร์แล้ว`, "#38bdf8");
                    buildGeneralStructure();
                }

                light.intensity = 4;
                setTimeout(() => light.intensity = 1.5, 800);
            }, 2500);
        }

        function buildDharmaStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let h = (Math.random() - 0.5) * 20;
                let r = (10 - h * 0.5) * Math.random();
                let angle = Math.random() * Math.PI * 2;
                d.target.set(Math.cos(angle)*r, h, Math.sin(angle)*r);
                d.color.setHex(P.dharma);
            }
        }

        function buildSufficiencyStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                d.target.set((Math.random()-0.5)*25, (Math.random()-0.5)*6 - 5, (Math.random()-0.5)*25);
                d.color.setHex(P.sufficiency);
            }
        }

        function buildAwarenessStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let angle = (i / cellCount) * Math.PI * 2;
                let r = 14 + (Math.random() * 2);
                d.target.set(Math.cos(angle)*r, (Math.random()-0.5)*2, Math.sin(angle)*r);
                d.color.setHex(P.pointer);
            }
        }

        function buildGeneralStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                d.target.set((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20);
                d.color.setHex(P.pointer);
            }
        }

        function updateHUD(title, sub, color) {
            document.getElementById('hud-title').innerText = title;
            document.getElementById('hud-title').style.color = color;
            document.getElementById('hud-sub').innerText = sub;
            document.getElementById('status-hud').style.borderColor = color;
            document.getElementById('status-hud').style.boxShadow = `0 0 25px ${color}40`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
