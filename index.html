<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Dharma Engine | เขื่อนภูมิพล 3-Arts Masterpiece</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        /* Pure UX Minimalist Glass HUD - สะอาดตา ไร้ปุ่มกวนใจ */
        .pure-hud {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 12px 28px;
            border-radius: 35px;
            font-size: 0.85rem;
            color: #38bdf8;
            font-family: 'Prompt', sans-serif;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            text-align: center;
            letter-spacing: 0.5px;
        }
        .pure-hud span {
            color: #fbbf24;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="pure-hud" id="hud-text">
        🏛️ <span>[ชั้นที่ 1] มหภาคภายนอก (รูปขันธ์ & ปฐวี-อาโปธาตุ)</span> แตะหน้าจอเพื่อวาร์ปสู่แก่นใน
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. 16-BIT INDEXED BLUEPRINT PALETTE (มหาภูตรูป 4) ---
        const Palette16 = {
            earthDark: 0x022c22, // ปฐวีธาตุเข้ม
            earthLight: 0x064e3b,// ปฐวีธาตุสว่าง
            waterDeep: 0x0369a1, // อาโปธาตุเชิงลึก
            waterBright: 0x0284c7,// อาโปธาตุระยิบระยับ
            steelCore: 0x475569, // โครงสร้างคอนกรีต
            steelEdge: 0x64748b, // ขอบเหล็กเสริม
            goldCore: 0xd97706,  // เตโชธาตุ / พลังงานหลัก
            goldBright: 0xfbbf24,// เตโชธาตุสว่าง
            cyanCore: 0x0284c7,  // วาโยธาตุ
            cyanBright: 0x38bdf8 // วาโยธาตุเรืองแสง
        };

        const QuantumRegistry = {
            currentLayer: 0,
            layersInfo: [
                "ชั้นที่ 1: มหภาคภายนอก (รูปขันธ์ & ปฐวี-อาโปธาตุ)",
                "ชั้นที่ 2: โครงสร้างเหล็กเสริมภายใน (Calculus Rebar Mesh & แรงกรรม)",
                "ชั้นที่ 3: เครือข่ายเซลล์จิตและขันธ์ 5 (Fluid & Cellular Voxel Mesh)",
                "ชั้นที่ 4: แก่นปรมัตถ์และธาตุแท้ (Atomic Core & ความว่างเปล่า / อนัตตา)"
            ]
        };

        // --- 2. SETUP SCENE & CAMERA (ไร้หมอกเพื่อให้เส้นสายคมชัดระดับพิมพ์เขียว) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);
        // ตัด THREE.Fog ออก เพื่อความคมชัดเฉียบคมทุกมิติ

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 46);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. LIGHTING (Cyber-Blueprint Chiaroscuro Style) ---
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(Palette16.goldBright, 2.2);
        dirLight.position.set(25, 45, 25);
        scene.add(dirLight);

        // --- 4. LAYER GROUPS ---
        const macroGroup = new THREE.Group();     
        const rebarGroup = new THREE.Group();     
        const cellularGroup = new THREE.Group();  
        const atomicGroup = new THREE.Group();    

        scene.add(macroGroup);
        scene.add(rebarGroup);
        scene.add(cellularGroup);
        scene.add(atomicGroup);

        // --- LAYER 1: MACRO (Advanced Math Terrain & Arch Dam) ---
        const terrainMat = new THREE.MeshLambertMaterial({ color: Palette16.earthLight, flatShading: true });
        
        const mLeft = new THREE.Mesh(new THREE.ConeGeometry(24, 28, 6), terrainMat);
        mLeft.position.set(-20, -3, -4);
        macroGroup.add(mLeft);

        const mRight = new THREE.Mesh(new THREE.ConeGeometry(26, 32, 6), terrainMat);
        mRight.position.set(20, -3, -4);
        macroGroup.add(mRight);

        // ตัวเขื่อนโค้งคอนกรีต (Arch Dam Geometry)
        const damGeo = new THREE.CylinderGeometry(15, 12, 16, 28, 1, true, 0, Math.PI);
        const damMat = new THREE.MeshLambertMaterial({ color: Palette16.steelCore, side: THREE.DoubleSide, flatShading: true });
        const archDam = new THREE.Mesh(damGeo, damMat);
        archDam.rotation.y = Math.PI / 2;
        archDam.position.set(0, 1, 0);
        macroGroup.add(archDam);

        // มวลน้ำเหนืออ่างเก็บน้ำ (Fluid Dynamics Wave Concept)
        const waterGeo = new THREE.PlaneGeometry(40, 30, 16, 16);
        const waterMat = new THREE.MeshBasicMaterial({ color: Palette16.waterBright, wireframe: true });
        const waterBody = new THREE.Mesh(waterGeo, waterMat);
        waterBody.rotation.x = -Math.PI / 2;
        waterBody.position.set(0, 0, 8);
        macroGroup.add(waterBody);


        // --- LAYER 2: CALCULUS REBAR MESH (โครงสร้างเหล็กเสริม & แรงกรรม) ---
        const rebarGeo = new THREE.BufferGeometry();
        const rebarPositions = [];
        for (let i = 0; i < 180; i++) {
            let theta = (i / 180) * Math.PI;
            let x = Math.cos(theta) * 13.5;
            let z = Math.sin(theta) * 13.5;
            rebarPositions.push(x, -6, z, x, 8, z);
        }
        rebarGeo.setAttribute('position', new THREE.Float32BufferAttribute(rebarPositions, 3));
        const rebarMesh = new THREE.LineSegments(rebarGeo, new THREE.LineBasicMaterial({ color: Palette16.goldBright }));
        rebarGroup.add(rebarMesh);
        rebarGroup.visible = false;


        // --- LAYER 3: CELLULAR FLUID MESH (ขันธ์ 5 & พอยต์เตอร์โหนดละเอียด) ---
        const cellCount = 160;
        const cellularInstanced = new THREE.InstancedMesh(
            new THREE.BoxGeometry(0.35, 0.35, 0.35), // 8-Bit Voxel Style
            new THREE.MeshBasicMaterial({ color: Palette16.cyanBright }),
            cellCount
        );
        const dummy = new THREE.Object3D();
        const cellData = [];
        for (let i = 0; i < cellCount; i++) {
            let u = Math.random() * Math.PI, v = Math.random() * Math.PI * 2, r = 7 + Math.random() * 4;
            let x = r * Math.sin(u) * Math.cos(v);
            let y = r * Math.cos(u) + 1;
            let z = r * Math.sin(u) * Math.sin(v);
            cellData.push({ x, y, z, vx: (Math.random()-0.5)*0.03, vy: (Math.random()-0.5)*0.03 });
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            cellularInstanced.setMatrixAt(i, dummy.matrix);
        }
        cellularGroup.add(cellularInstanced);
        cellularGroup.visible = false;


        // --- LAYER 4: ATOMIC CORE (ปรมัตถสัจจะ & ความว่างเปล่า) ---
        const atomCore = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshBasicMaterial({ color: Palette16.goldBright }));
        atomicGroup.add(atomCore);
        for(let j = 1; j <= 3; j++) {
            let orbit = new THREE.Mesh(
                new THREE.RingGeometry(j * 3.0 - 0.05, j * 3.0 + 0.05, 20),
                new THREE.MeshBasicMaterial({ color: Palette16.cyanBright, side: THREE.DoubleSide })
            );
            orbit.rotation.x = Math.PI / 2 + j * 0.6;
            atomicGroup.add(orbit);
        }
        atomicGroup.visible = false;


        // --- PURE UX: TOUCH-TO-TOGGLE QUANTUM WARP ---
        window.addEventListener('click', handleToggleWarp);
        window.addEventListener('touchstart', handleToggleWarp);

        function handleToggleWarp(e) {
            e.preventDefault();
            QuantumRegistry.currentLayer = (QuantumRegistry.currentLayer + 1) % 4;
            updateLayerState();
        }

        function updateLayerState() {
            let layer = QuantumRegistry.currentLayer;
            macroGroup.visible = (layer === 0);
            rebarGroup.visible = (layer === 1);
            cellularGroup.visible = (layer === 2);
            atomicGroup.visible = (layer === 3);

            document.getElementById('hud-text').innerHTML = `
                🏛️ <span>[${QuantumRegistry.layersInfo[layer]}]</span> แตะเพื่อเปลี่ยนชั้น
            `;
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let elapsedTime = clock.getElapsedTime();

            let targetZ = 46 - QuantumRegistry.currentLayer * 13;
            camera.position.z += (targetZ - camera.position.z) * 0.08;
            camera.lookAt(0, 0, 0);

            if (QuantumRegistry.currentLayer === 0) {
                waterBody.position.z = 8 + Math.sin(elapsedTime * 4) * 0.25;
            } else if (QuantumRegistry.currentLayer === 1) {
                rebarGroup.rotation.y = elapsedTime * 0.25;
            } else if (QuantumRegistry.currentLayer === 2) {
                for (let i = 0; i < cellCount; i++) {
                    let d = cellData[i];
                    d.x += d.vx; d.y += d.vy;
                    dummy.position.set(d.x, d.y, d.z);
                    dummy.updateMatrix();
                    cellularInstanced.setMatrixAt(i, dummy.matrix);
                }
                cellularInstanced.instanceMatrix.needsUpdate = true;
            } else if (QuantumRegistry.currentLayer === 3) {
                atomicGroup.rotation.y = elapsedTime * 0.6;
                atomicGroup.rotation.z = elapsedTime * 0.35;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
