<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Dharma Engine | Infinite Voxel Mitosis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Sarabun', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .pure-hud {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(2, 6, 23, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 32px; border-radius: 40px; font-size: 0.95rem; color: #38bdf8;
            font-family: 'Prompt', sans-serif; text-align: center; letter-spacing: 1px; pointer-events: none;
        }
        .pure-hud span { color: #fbbf24; font-weight: 600; display: block; margin-top: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="pure-hud" id="hud-text">
        สุญญตา & ปฐมธาตุ
        <span id="sub-text">จุดกำเนิดแห่งอนันต์ (1 DNA)</span>
    </div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const Palette = {
            void: 0x0f172a, mountain: 0x064e3b, damCore: 0x64748b, damGlow: 0x38bdf8, water: 0x0284c7, seed: 0xfbbf24
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(Palette.void);
        scene.fog = new THREE.Fog(Palette.void, 30, 80); // เพิ่ม Fog เล็กน้อยให้ขอบฟ้าดูลึกซึ้ง

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 55);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        // --- THE VOXEL MITOSIS ARCHITECTURE ---
        // ใช้โหนด 16,384 (2^14) เป็นตัวแทนของเซลล์ที่แบ่งตัวแบบทวีคูณสู่อนันต์
        const cellCount = 16384; 
        const voxelSize = 0.6; // ขนาด 1 พิกเซล 3 มิติ
        
        // ใช้ BoxGeometry ให้ประกอบกันแน่นทึบเป็นคริสตัลหรือ Pixel 3D
        const voxelGeo = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);
        const voxelMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        const cellData = [];
        const dummy = new THREE.Object3D();
        
        // จุดกำเนิดเดียว (The Singularity Zygote)
        const originPoint = new THREE.Vector3(0, -2, 0); 

        // ฟังก์ชันล็อกตำแหน่งให้อยู่ในตารางกริด (Snap to Grid) ทำให้พิกเซลต่อกันสนิท
        function snapToGrid(val, size) {
            return Math.floor(val / size) * size;
        }

        for (let i = 0; i < cellCount; i++) {
            let tx, ty, tz;
            let colorHex;
            let type = Math.random();

            if (type < 0.35) {
                // เขื่อนโค้ง (Arch Dam)
                let angle = (Math.random() * Math.PI) - (Math.PI / 2);
                let radius = 16 + (Math.random() * 3);
                tx = Math.sin(angle) * radius;
                tz = (Math.cos(angle) * radius * 0.4) - 4;
                ty = (Math.random() * 15) - 2;
                colorHex = (Math.random() > 0.9) ? Palette.damGlow : Palette.damCore;
            } else if (type < 0.7) {
                // ภูเขา (Mountain Voxels)
                let side = (Math.random() > 0.5) ? 1 : -1;
                let r = Math.random() * 15;
                let theta = Math.random() * Math.PI * 2;
                tx = (22 * side) + (r * Math.cos(theta));
                tz = -6 + (r * Math.sin(theta));
                ty = -3 + ((15 - r) * Math.random());
                colorHex = Palette.mountain;
            } else {
                // มวลน้ำ (Water Voxels)
                tx = (Math.random() - 0.5) * 40;
                tz = 4 + (Math.random() * 25);
                ty = -2 + (Math.random() * 1);
                colorHex = Palette.water;
            }

            // SNAP TO GRID! (กริ๊ก! ล็อกเข้ากริดให้เป็น Voxel ที่สมบูรณ์แบบ)
            let targetPos = new THREE.Vector3(
                snapToGrid(tx, voxelSize),
                snapToGrid(ty, voxelSize),
                snapToGrid(tz, voxelSize)
            );

            // คำนวณเส้นกรรม (Bezier Control Point)
            let controlPos = new THREE.Vector3(
                targetPos.x * (1 + Math.random()), 
                targetPos.y + 15 + Math.random() * 10, 
                targetPos.z * (1 + Math.random())
            );

            // กรรมและเวลาเกิดของเซลล์ (จากฐานขึ้นสู่ยอด)
            let karmaDelay = Math.min(1, Math.max(0, (targetPos.y + 3) / 18 + Math.random() * 0.1));

            cellData.push({
                origin: originPoint.clone(),
                target: targetPos,
                control: controlPos,
                color: new THREE.Color(colorHex),
                karmaDelay: karmaDelay
            });

            instancedVoxels.setColorAt(i, new THREE.Color(Palette.seed));
        }
        instancedVoxels.instanceColor.needsUpdate = true;

        const clock = new THREE.Clock();
        const hudText = document.getElementById('hud-text');
        const subText = document.getElementById('sub-text');

        function getBezier(t, p0, p1, p2) {
            let u = 1 - t, tt = t * t, uu = u * u;
            return new THREE.Vector3(
                uu * p0.x + 2 * u * t * p1.x + tt * p2.x,
                uu * p0.y + 2 * u * t * p1.y + tt * p2.y,
                uu * p0.z + 2 * u * t * p1.z + tt * p2.z
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();
            
            // ลมหายใจรอบละ 18 วินาที
            let breath = (Math.sin(time * 0.35) + 1) / 2; 

            if (breath < 0.1) {
                hudText.childNodes[0].nodeValue = "สุญญตา & ปฐมธาตุ";
                subText.innerText = "จุดกำเนิดแห่งอนันต์ (1 DNA)";
            } else if (breath >= 0.1 && breath < 0.95) {
                hudText.childNodes[0].nodeValue = (Math.cos(time * 0.35) > 0) ? "แบ่งเซลล์ & เติบโต" : "สลายตัวคืนสู่ความว่าง";
                subText.innerText = "เซลล์พิกเซลเดินทางตามเส้นกรรม เสียบเข้าล็อกโครงสร้าง";
            } else {
                hudText.childNodes[0].nodeValue = "สถิตยภูมิ (Voxel Interlock)";
                subText.innerText = "โครงสร้างรูปขันธ์ผสานเป็นหนึ่งเดียว";
            }

            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let lifeProgress = 0;
                let activeRange = 0.5; 
                
                if (breath > d.karmaDelay * activeRange) {
                    lifeProgress = (breath - (d.karmaDelay * activeRange)) / activeRange;
                    lifeProgress = Math.min(1, Math.max(0, lifeProgress));
                }

                // การวิ่งแบบ Ease Out
                let easeProgress = 1 - Math.pow(1 - lifeProgress, 3);
                let currentPos = getBezier(easeProgress, d.origin, d.control, d.target);

                // ถ้าเป็นผิวน้ำ ให้กระเพื่อมนิดๆ แม้จะล็อกกริดแล้ว
                if (d.color.getHex() === Palette.water && easeProgress === 1) {
                    currentPos.y += Math.sin(time * 2 + currentPos.x * 0.5) * (voxelSize * 0.2);
                }

                // ขนาดเซลล์ เริ่มจากศูนย์ ขยายเต็มที่เมื่อล็อกเข้าที่
                let scale = lifeProgress > 0 ? (0.1 + (easeProgress * 0.9)) : 0;
                // หมุนตัวระหว่างเดินทาง และหยุดนิ่ง(ล็อก)เมื่อถึงเป้าหมาย
                let rot = (1 - easeProgress) * Math.PI * 4;

                dummy.position.copy(currentPos);
                dummy.rotation.set(rot, rot, rot);
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
                
                // เปลี่ยนสีจากพลังงานกำเนิด (Seed) เป็นธาตุตามหน้าที่เมื่อเข้าใกล้เป้าหมาย
                if (easeProgress > 0.7) {
                    instancedVoxels.setColorAt(i, d.color);
                } else {
                    instancedVoxels.setColorAt(i, new THREE.Color(Palette.seed));
                }
            }
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;

            // กล้องโคจรรอบๆ เพื่อเห็นความตระการตาของการผสาน Voxel
            camera.position.x = Math.sin(time * 0.15) * 25;
            camera.position.z = 45 + Math.cos(time * 0.15) * 15;
            camera.lookAt(0, 4, 0);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
