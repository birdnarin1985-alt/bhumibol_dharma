<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Mantra Laboratory | ห้องทดลองมนตราชิติจิตอล</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif;
            overflow: hidden; width: 100vw; height: 100vh; touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD ระบบห้องทดลอง */
        .os-ui {
            position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 15px; transition: opacity 0.4s ease;
        }
        
        .status-hud {
            background: rgba(2, 6, 23, 0.65); backdrop-filter: blur(8px); border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 8px 20px; border-radius: 30px; text-align: center; font-family: 'Prompt', sans-serif;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.15); max-width: 90%; pointer-events: auto;
            cursor: pointer; transition: 0.3s;
        }
        .status-hud:hover { background: rgba(2, 6, 23, 0.85); border-color: rgba(251, 191, 36, 0.8); }
        
        #hud-title { color: #fbbf24; font-size: 0.9rem; font-weight: 600; }
        #hud-sub { color: #38bdf8; display: block; font-size: 0.75rem; font-weight: 300; opacity: 0.8; }

        /* ปุ่มเปิด-ปิดเสียงสวด และ Zen Mode มุมขวาบน */
        .top-controls {
            position: absolute; top: 15px; right: 15px; z-index: 20; display: flex; gap: 8px; pointer-events: auto;
        }
        .top-btn {
            background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8; padding: 8px 12px; border-radius: 12px; font-family: 'Prompt', sans-serif;
            font-size: 0.8rem; cursor: pointer; backdrop-filter: blur(6px); transition: 0.3s;
        }
        .top-btn:hover { background: rgba(56, 189, 248, 0.3); color: #fff; }

        /* จุดกำเนิดแห่งคาถา (มุมซ้ายล่าง) */
        .mantra-origin-trigger {
            position: absolute; bottom: 20px; left: 20px; z-index: 20; pointer-events: auto;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(168, 85, 247, 0.3));
            border: 1px solid rgba(56, 189, 248, 0.8); color: #38bdf8; padding: 12px 20px;
            border-radius: 20px; font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .mantra-origin-trigger:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(168, 85, 247, 0.5); color: #fff; }

        /* แผงควบคุมคีย์ลัดคาถา (พับเก็บได้ที่จุดกำเนิดซ้ายล่าง) */
        .control-panel {
            position: absolute; bottom: 80px; left: 20px; z-index: 20;
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 15px; border-radius: 24px; display: flex; flex-direction: column; gap: 10px;
            pointer-events: auto; width: 320px; max-width: 90vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            transform-origin: bottom left; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        .control-panel.collapsed { transform: scale(0); opacity: 0; pointer-events: none; }

        .speech-display {
            width: 100%; background: rgba(2, 6, 23, 0.7); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px; border-radius: 14px; text-align: center; font-family: 'Prompt', sans-serif;
            font-size: 0.95rem; color: #fbbf24; min-height: 40px; display: flex; align-items: center; justify-content: center;
            letter-spacing: 1px; word-break: break-all;
        }
        .speech-display span { color: rgba(248, 250, 252, 0.35); font-style: italic; font-size: 0.8rem; }

        .shortcut-section { width: 100%; display: flex; flex-direction: column; gap: 4px; }
        .section-label {
            font-size: 0.7rem; font-family: 'Prompt', sans-serif; color: rgba(248, 250, 252, 0.6);
            padding-left: 4px; display: flex; justify-content: space-between;
        }
        .btn-row { display: flex; gap: 6px; width: 100%; justify-content: center; }

        .shortcut-btn {
            border-radius: 10px; padding: 8px 10px; cursor: pointer; font-family: 'Prompt', sans-serif;
            font-weight: 600; font-size: 0.82rem; transition: 0.2s; flex: 1; text-align: center; border: 1px solid;
            touch-action: manipulation;
        }
        .shortcut-btn:active { transform: scale(0.95); filter: brightness(1.3); }

        .btn-subject { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.5); color: #38bdf8; }
        .btn-object { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.5); color: #34d399; }
        .btn-verb { background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.5); color: #fbbf24; }
        .btn-clean { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.6); color: #c084fc; }
        .btn-execute { background: rgba(56, 189, 248, 0.3); border-color: #38bdf8; color: #fff; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .btn-release { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.6); color: #ef4444; }

        .mic-btn {
            background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444; border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: 0.2s;
            font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; gap: 4px;
            touch-action: manipulation; flex: 1;
        }
        .mic-btn.listening { background: rgba(239, 68, 68, 0.7); color: #fff; box-shadow: 0 0 12px #ef4444; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

        body.zen-mode .os-ui { opacity: 0; pointer-events: none; }
        body.zen-mode .top-btn { opacity: 0.3; }
        body.zen-mode .top-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <!-- ปุ่มควบคุมมุมขวาบน (ปิด-เปิดเสียง และ Zen Mode) -->
    <div class="top-controls">
        <button class="top-btn" id="sound-toggle-btn" onclick="toggleSound()">🔊 เสียงสวด: เปิด</button>
        <button class="top-btn" onclick="toggleZenMode()">👁️ Zen</button>
    </div>

    <!-- จุดกำเนิดแห่งคาถา (มุมซ้ายล่าง) -->
    <button class="mantra-origin-trigger" onclick="toggleControlPanel()">
        ✨ จุดกำเนิดคาถา
    </button>

    <!-- แผงควบคุมคีย์ลัดคาถา (พับเก็บยุบตัวลงที่จุดกำเนิด) -->
    <div class="control-panel collapsed" id="control-panel">
        <div class="speech-display" id="spell-builder-display">
            <span>(ประกอบคาถา: ประธาน + กรรม + กริยา)</span>
        </div>
        
        <div class="shortcut-section">
            <div class="section-label"><span>ประธาน (Subject)</span><span style="color:#38bdf8">■ ฟ้า</span></div>
            <div class="btn-row">
                <button class="shortcut-btn btn-subject" onclick="appendSpell('จิตฺต')">จิตฺต</button>
                <button class="shortcut-btn btn-subject" onclick="appendSpell('อัตตา')">อัตตา</button>
            </div>
        </div>

        <div class="shortcut-section">
            <div class="section-label"><span>กรรม (Object)</span><span style="color:#34d399">■ เขียว</span></div>
            <div class="btn-row">
                <button class="shortcut-btn btn-object" onclick="appendSpell('ธมฺม')">ธมฺม</button>
                <button class="shortcut-btn btn-object" onclick="appendSpell('โยค')">โยค</button>
                <button class="shortcut-btn btn-object" onclick="appendSpell('ญาณ')">ญาณ</button>
            </div>
        </div>

        <div class="shortcut-section">
            <div class="section-label"><span>กริยา / คาถา (Action)</span><span style="color:#fbbf24">■ ทอง</span></div>
            <div class="btn-row">
                <button class="shortcut-btn btn-verb" onclick="appendSpell('นิปปัตติ')">นิปปัตติ</button>
                <button class="shortcut-btn btn-verb" onclick="appendSpell('ปฏิจจะ')">ปฏิจจะ</button>
                <button class="shortcut-btn btn-verb" onclick="appendSpell('สัตติ')">สัตติ</button>
            </div>
        </div>

        <div class="btn-row" style="margin-top: 2px;">
            <button class="mic-btn" id="mic-toggle-btn" onclick="toggleSpeechRecognition()">🎙️ พูด</button>
            <button class="shortcut-btn btn-clean" onclick="cleanMind()">โสธะนัม</button>
            <button class="shortcut-btn btn-execute" onclick="processIntent()">สัมปติจฉามิ</button>
        </div>
        <div class="btn-row" style="margin-top: 2px;">
            <button class="shortcut-btn btn-release" onclick="releaseMantra()">🌀 คลายคาถา (สู่สุญญตา)</button>
        </div>
    </div>

    <div class="os-ui">
        <div class="status-hud" id="status-hud" onclick="toggleControlPanel()" title="แตะเพื่อเปิดคีย์ลัดคาถา">
            <div id="hud-title">Digital Mantra Laboratory (สุญญตาพร้อม)</div>
            <span id="hud-sub">แตะ "จุดกำเนิดคาถา" มุมซ้ายล่าง เพื่อเริ่มทดลอง</span>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const P = { void: 0x020617, idle: 0x475569, dharma: 0xfbbf24, sufficiency: 0x10b981, pointer: 0x38bdf8, wisdom: 0xa855f7 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(P.void);
        scene.fog = new THREE.FogExp2(P.void, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.5, 100);
        light.position.set(0, 25, 15);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2.5));

        const cellCount = 3000; 
        const voxelGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const voxelMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, metalness: 0.1, roughness: 0.2, transmission: 0.5, thickness: 0.5
        });
        
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        const dummy = new THREE.Object3D();
        const cellData = [];
        let systemState = 0; // 0=Idle/Void, 1=Dissolving/Melting, 2=Active Mantra
        let currentSpellArray = [];
        let activeBehavior = 'idle';
        let soundEnabled = true;

        for (let i = 0; i < cellCount; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            let r = 16 + Math.random() * 18;
            let idlePos = new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            
            cellData.push({ 
                current: idlePos.clone(), 
                idle: idlePos, 
                target: new THREE.Vector3(), 
                baseTarget: new THREE.Vector3(),
                color: new THREE.Color(P.idle),
                speed: 0.02 + Math.random() * 0.03,
                index: i
            });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];

                if (systemState === 0) {
                    // IDLE / SUNITYA: ลอยเคว้งคว้างว่างเปล่า
                    d.current.x = d.idle.x + Math.sin(time * 0.4 + i) * 1.5;
                    d.current.y = d.idle.y + Math.cos(time * 0.3 + i) * 1.5;
                    d.current.z = d.idle.z + Math.sin(time * 0.35 + i) * 1.5;
                    instancedVoxels.setColorAt(i, new THREE.Color(P.idle));
                } else if (systemState === 1) {
                    // MELTING / DISSOLVING: โมเลกุลกระจายตัวระยิบระยับก่อนประกอบร่าง
                    d.current.lerp(d.target, 0.08);
                } else {
                    // ACTIVE MANTRA: Voxel แสดงพฤติกรรมตามกรรม
                    let tx = d.baseTarget.x;
                    let ty = d.baseTarget.y;
                    let tz = d.baseTarget.z;

                    if (activeBehavior === 'dharma') {
                        ty += Math.sin(time * 3 + i * 0.1) * 1.2;
                    } else if (activeBehavior === 'sufficiency') {
                        tx += (Math.random() - 0.5) * 0.3;
                        tz += (Math.random() - 0.5) * 0.3;
                    } else if (activeBehavior === 'wisdom') {
                        let angleOffset = time * 1.5 + (i * 0.01);
                        let currentR = Math.sqrt(tx*tx + tz*tz);
                        tx = Math.cos(angleOffset) * currentR;
                        tz = Math.sin(angleOffset) * currentR;
                    }

                    d.target.set(tx, ty, tz);
                    d.current.lerp(d.target, d.speed);
                    instancedVoxels.setColorAt(i, d.color);
                }

                dummy.position.copy(d.current);
                dummy.rotation.set(time * (systemState > 0 ? 1 : 0.2), time * 0.5, 0);
                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
            }
            
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;
            
            camera.position.x = Math.sin(time * 0.15) * 35;
            camera.position.z = Math.cos(time * 0.15) * 35;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // ---- ฟังก์ชันเปิด-ปิดเสียงสวด ----
        function toggleSound() {
            soundEnabled = !soundEnabled;
            let btn = document.getElementById('sound-toggle-btn');
            btn.innerText = soundEnabled ? "🔊 เสียงสวด: เปิด" : "🔇 เสียงสวด: ปิด";
        }

        function chantMantra(text) {
            if (!soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.85;
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ---- ควบคุมการพับเก็บแผงคีย์ลัดที่จุดกำเนิดซ้ายล่าง ----
        function toggleControlPanel() {
            let panel = document.getElementById('control-panel');
            panel.classList.toggle('collapsed');
        }

        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
        }

        function appendSpell(word) {
            currentSpellArray.push(word);
            let spellStr = currentSpellArray.join(" ");
            document.getElementById('spell-builder-display').innerHTML = `<b>${spellStr}</b>`;
        }

        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('mic-toggle-btn').classList.add('listening');
                updateHUD("กำลังสดับรับฟัง...", "โปรดเอ่ยคาถาภาษาโยนิโส", "#ef4444");
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                currentSpellArray = [transcript];
                document.getElementById('spell-builder-display').innerHTML = `<b>${transcript}</b>`;
            };

            recognition.onerror = function(event) { stopListening(); };
            recognition.onend = function() { stopListening(); };
        }

        function toggleSpeechRecognition() {
            if (!recognition) { alert("เบราว์เซอร์ไม่รองรับเสียงพูด"); return; }
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function stopListening() {
            isListening = false;
            document.getElementById('mic-toggle-btn').classList.remove('listening');
        }

        // ---- ล้างจิต (โสธะนัม) ----
        function cleanMind() {
            currentSpellArray = [];
            document.getElementById('spell-builder-display').innerHTML = `<span>(ประกอบคาถา: ประธาน + กรรม + กริยา)</span>`;
            systemState = 0;
            activeBehavior = 'idle';
            updateHUD("โสธะนัม (ล้างจิตสำเร็จ)", "จิตว่างเปล่า พร้อมร้อยเรียงคาถาใหม่", "#c084fc");
            chantMantra("โส ธะ นัม");

            light.color.setHex(0xc084fc);
            light.intensity = 3;
            setTimeout(() => { light.color.setHex(0xffffff); light.intensity = 1.5; }, 600);
        }

        // ---- คลายคาถา คืนสู่สุญญตา (ยุบตัวลงที่จุดกำเนิดซ้ายล่าง) ----
        function releaseMantra() {
            systemState = 1;
            activeBehavior = 'idle';
            updateHUD("คลายคาถา (คืนสู่สุญญตา)", "อนุภาคยุบตัวกลับสู่จุดกำเนิดซ้ายล่าง", "#ef4444");
            chantMantra("สุญญตา");

            // ดึงอนุภาคทั้งหมดให้พุ่งมารวมกันที่มุมซ้ายล่าง (พิกัดหน้าจอเทียบเคียง)
            for (let i = 0; i < cellCount; i++) {
                cellData[i].target.set(-25, -20, 0); // ยุบลงมุมซ้ายล่าง
                cellData[i].color.setHex(P.idle);
            }

            setTimeout(() => {
                systemState = 0;
                updateHUD("สุญญตาบริสุทธิ์", "ห้องทดลองพร้อมรับคาถาใหม่", "#fbbf24");
            }, 2000);
        }

        // ---- สัมปติจฉามิ: ตัวหนังสือแตกตัวเป็นโมเลกุลระยิบระยับ กลายเป็น Voxel ----
        function processIntent() {
            let spellFull = currentSpellArray.join(" ").trim();
            let spellLower = spellFull.toLowerCase();
            if(!spellFull) {
                updateHUD("จิตยังว่างเปล่า", "โปรดประกอบคาถาก่อนกด 'สัมปติจฉามิ'", "#ef4444");
                return;
            }

            chantMantra(spellFull);

            // ซ่อนแผงคีย์ลัดอัตโนมัติเมื่อกดสัมปติจฉามิ (คอกล่องคาถาหุบลง)
            document.getElementById('control-panel').classList.add('collapsed');

            // เฟส 1: ตัวหนังสือแตกตัวเป็นโมเลกุลพุ่งกระจาย (Melting Effect)
            systemState = 1;
            updateHUD("โยนิโสมนสิการ (คาถาแตกตัวเป็นโมเลกุล)", `ร่ายคาถา: "${spellFull}"`, "#fbbf24");
            
            for (let i = 0; i < cellCount; i++) {
                cellData[i].target.set((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15);
                cellData[i].color.setHex(0xffffff); // สว่างไสวราวดาวระยิบระยับ
            }

            // เฟส 2: หลอมรวมร่างและแสดงพฤติกรรมตามกรรม
            setTimeout(() => {
                systemState = 2;
                
                if (spellLower.includes("ธมฺม") || spellLower.includes("ธรรมะ")) {
                    activeBehavior = 'dharma';
                    updateHUD("คาถาบรรเจิด: จิต + ธรรมะ", "พฤติกรรม Voxel: แผ่รัศมีแสงธรรมสงบเยือกเย็น", "#fbbf24");
                    buildDharmaStructure();
                } else if (spellLower.includes("โยค") || spellLower.includes("พอเพียง")) {
                    activeBehavior = 'sufficiency';
                    updateHUD("คาถาบรรเจิด: จิต + พอเพียง", "พฤติกรรม Voxel: ฐานรากมั่นคง หนันทนแข็งแกร่ง", "#10b981");
                    buildSufficiencyStructure();
                } else if (spellLower.includes("ญาณ") || spellLower.includes("ปัญญา")) {
                    activeBehavior = 'wisdom';
                    updateHUD("คาถาบรรเจิด: จิต + ญาณ", "พฤติกรรม Voxel: หมุนวนพายุพลังแห่งปัญญาญาณ", "#a855f7");
                    buildWisdomStructure();
                } else {
                    activeBehavior = 'idle';
                    updateHUD("สัมปติจฉามิ (คาถาสัมฤทธิ์ผล)", `ฝังคาถา "${spellFull}" ลงฮาร์ดแวร์แล้ว`, "#38bdf8");
                    buildGeneralStructure();
                }

                light.intensity = 4;
                setTimeout(() => light.intensity = 1.5, 800);
            }, 1800);
        }

        function buildDharmaStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let h = (Math.random() - 0.5) * 20;
                let r = (10 - h * 0.5) * Math.random();
                let angle = Math.random() * Math.PI * 2;
                d.baseTarget.set(Math.cos(angle)*r, h, Math.sin(angle)*r);
                d.color.setHex(P.dharma);
            }
        }

        function buildSufficiencyStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                d.baseTarget.set((Math.random()-0.5)*25, (Math.random()-0.5)*6 - 5, (Math.random()-0.5)*25);
                d.color.setHex(P.sufficiency);
            }
        }

        function buildWisdomStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let angle = i * 0.1;
                let r = (i / cellCount) * 15 + 2;
                let h = (Math.random() - 0.5) * 18;
                d.baseTarget.set(Math.cos(angle)*r, h, Math.sin(angle)*r);
                d.color.setHex(P.wisdom);
            }
        }

        function buildGeneralStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                d.baseTarget.set((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20);
                d.color.setHex(P.pointer);
            }
        }

        function updateHUD(title, sub, color) {
            document.getElementById('hud-title').innerText = title;
            document.getElementById('hud-title').style.color = color;
            document.getElementById('hud-sub').innerText = sub;
            document.getElementById('status-hud').style.borderColor = color;
            document.getElementById('status-hud').style.boxShadow = `0 0 20px ${color}40`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
