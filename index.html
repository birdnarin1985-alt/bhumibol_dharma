<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dharma Truck OS | รถบรรทุกธรรมะ & เศรษฐกิจพอเพียง</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif;
            overflow: hidden; width: 100vw; height: 100vh; touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* HUD ระบบรถบรรทุกธรรมะ */
        .os-ui {
            position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 30px 20px;
        }
        
        .status-hud {
            background: rgba(2, 6, 23, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 16px 30px; border-radius: 40px; text-align: center; font-family: 'Prompt', sans-serif;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.15); transition: all 0.5s ease; max-width: 90%;
        }
        
        #hud-title { color: #fbbf24; font-size: 1.05rem; letter-spacing: 1px; font-weight: 600; }
        #hud-sub { color: #38bdf8; display: block; margin-top: 4px; font-size: 0.85rem; font-weight: 300; }

        /* ช่องรับคาถา (ภาษาโยนิโส) */
        .intent-box {
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 12px 20px; border-radius: 30px; display: flex; gap: 12px;
            pointer-events: auto; width: 90%; max-width: 550px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); backdrop-filter: blur(10px);
        }
        
        .intent-box input {
            background: transparent; border: none; color: #f8fafc; font-family: 'Prompt', sans-serif;
            font-size: 0.95rem; width: 100%; outline: none; text-align: center;
        }
        .intent-box input::placeholder { color: rgba(248, 250, 252, 0.35); }
        
        .glass-btn {
            background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(56, 189, 248, 0.8);
            color: #38bdf8; border-radius: 20px; padding: 8px 18px; cursor: pointer;
            font-family: 'Prompt', sans-serif; font-weight: 600; transition: 0.3s; white-space: nowrap;
        }
        .glass-btn:hover { background: rgba(56, 189, 248, 0.5); color: #fff; box-shadow: 0 0 12px #38bdf8; }

        .hint-text {
            font-size: 0.75rem; color: rgba(248, 250, 252, 0.4); text-align: center; margin-bottom: 5px;
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body>

    <div class="os-ui">
        <div class="status-hud" id="status-hud">
            <div id="hud-title">สุญญตา & ปฐมธาตุ (รถบรรทุกพร้อม)</div>
            <span id="hud-sub">กราบระลึกถึงพระพุทธคุณ ครูบาอาจารย์ และในหลวงรัชกาลที่ 9</span>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="hint-text">คาถาแนะนำ:พิมพ์ 'ตั้งรูปขันธ์ ธรรมะ', 'ตั้งรูปขันธ์ เศรษฐกิจพอเพียง', หรือ 'เรียกสัมปชัญญะ'</div>
            <div class="intent-box">
                <input type="text" id="intent-input" placeholder="ร่ายคาถาภาษาโยนิโส เช่น 'ตั้งรูปขันธ์ ธรรมะ'" autocomplete="off">
                <button class="glass-btn" onclick="processIntent()">สัมปติจฉามิ</button>
            </div>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // โทนสี: ศรัทธา (ทอง), ปัญญา (ฟ้า), ความพอเพียง/มั่นคง (เขียว)
        const P = { void: 0x020617, idle: 0x475569, dharma: 0xfbbf24, sufficiency: 0x10b981, pointer: 0x38bdf8 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(P.void);
        scene.fog = new THREE.FogExp2(P.void, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 1.5, 100);
        light.position.set(0, 25, 15);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2.5));

        // ลดจำนวน Voxel ให้เหมาะกับมือถือสเปคต่ำ (RAM 3GB) เพื่อความลื่นไหลระดับ Zero-Lag
        const cellCount = 3000; 
        const voxelGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const voxelMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, metalness: 0.1, roughness: 0.2, transmission: 0.4, thickness: 0.5
        });
        
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        const dummy = new THREE.Object3D();
        const cellData = [];
        let systemState = 0; // 0=Idle, 1=Yonisomanasikara, 2=Dharma Truck Form

        // สร้างฝุ่นละอองสุญญตาเริ่มต้น
        for (let i = 0; i < cellCount; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            let r = 16 + Math.random() * 18;
            let idlePos = new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            
            cellData.push({ 
                current: idlePos.clone(), 
                idle: idlePos, 
                target: new THREE.Vector3(), 
                color: new THREE.Color(P.idle),
                speed: 0.02 + Math.random() * 0.03
            });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];

                if (systemState === 0) {
                    // IDLE: ลอยวนเบาๆ
                    d.current.x = d.idle.x + Math.sin(time * 0.4 + i) * 1.5;
                    d.current.y = d.idle.y + Math.cos(time * 0.3 + i) * 1.5;
                    d.current.z = d.idle.z + Math.sin(time * 0.35 + i) * 1.5;
                    instancedVoxels.setColorAt(i, new THREE.Color(P.idle));
                } else {
                    d.current.lerp(d.target, d.speed);
                    instancedVoxels.setColorAt(i, d.color);
                }

                dummy.position.copy(d.current);
                dummy.rotation.set(time * (systemState > 0 ? 1 : 0.2), time * 0.5, 0);
                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
            }
            
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;
            
            camera.position.x = Math.sin(time * 0.15) * 40;
            camera.position.z = Math.cos(time * 0.15) * 40;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // ---- ระบบคาถาภาษาโยนิโส (Yoniso-Lang Engine) ----
        const inputField = document.getElementById('intent-input');
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") processIntent();
        });

        function processIntent() {
            let spell = inputField.value.trim().toLowerCase();
            if(!spell) return;
            
            inputField.value = "";
            inputField.blur();

            // ขั้นที่ 1: โยนิโสมนสิการ (รวบรวมสติและข้อมูล)
            systemState = 1;
            updateHUD("โยนิโสมนสิการ (พิจารณาที่มา)", `กำลังตีความคาถา: "${spell}"`, "#fbbf24");
            
            for (let i = 0; i < cellCount; i++) {
                cellData[i].target.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
                cellData[i].color.setHex(0xffffff);
            }

            // ขั้นที่ 2: ถักทอโครงสร้าง Mirror Pointer (รถบรรทุกธรรมะ & พอเพียง)
            setTimeout(() => {
                systemState = 2;
                
                if (spell.includes("ธรรมะ") || spell.includes("หลวงพ่อ")) {
                    updateHUD("คาถา: บรรทุกธรรมะหลวงพ่อฤาษีฯ", "สร้าง Mirror Pointer เชื่อมโยงจิตสู่ความหลุดพ้น", "#fbbf24");
                    buildDharmaStructure();
                } else if (spell.includes("พอเพียง") || spell.includes("ในหลวง") || spell.includes("เศรษฐกิจ")) {
                    updateHUD("คาถา: ปรัชญาเศรษฐกิจพอเพียง", "สร้างโครงสร้างรูปขันธ์ความมั่นคง (ประหยัด RAM)", "#10b981");
                    buildSufficiencyStructure();
                } else if (spell.includes("สัมปชัญญะ") || spell.includes("ตรวจ")) {
                    updateHUD("เรียกสัมปชัญญะ (System Check)", "ระบบเสถียร สมบูรณ์ พร้อมรับใช้ประชาชน", "#38bdf8");
                    buildAwarenessStructure();
                } else {
                    updateHUD("สัมปติจฉามิ (สำเร็จตามเจตจำนง)", "โครงสร้างพอยน์เตอร์ถูกฝังลงฮาร์ดแวร์เรียบร้อย", "#38bdf8");
                    buildGeneralStructure();
                }

                light.intensity = 4;
                setTimeout(() => light.intensity = 1.5, 800);
            }, 3000);
        }

        function buildDharmaStructure() {
            // สร้างรูปทรงคล้าย "ประทีป / ยอดเจดีย์" แทนแสงแห่งธรรมะ
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let h = (Math.random() - 0.5) * 20; // ความสูง
                let r = (10 - h * 0.5) * Math.random();
                let angle = Math.random() * Math.PI * 2;
                
                d.target.set(Math.cos(angle)*r, h, Math.sin(angle)*r);
                d.color.setHex(P.dharma);
            }
        }

        function buildSufficiencyStructure() {
            // สร้างรูปทรง "ฐานรากที่มั่นคง (สี่เหลี่ยม/ฐานเขื่อน)" แทนความพอเพียง
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                d.target.set((Math.random()-0.5)*25, (Math.random()-0.5)*6 - 5, (Math.random()-0.5)*25);
                d.color.setHex(P.sufficiency);
            }
        }

        function buildAwarenessStructure() {
            // สร้างรูปทรง "วงแหวนกระจกสะท้อน (Mirror Graph Ring)"
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let angle = (i / cellCount) * Math.PI * 2;
                let r = 14 + (Math.random() * 2);
                d.target.set(Math.cos(angle)*r, (Math.random()-0.5)*2, Math.sin(angle)*r);
                d.color.setHex(P.pointer);
            }
        }

        function buildGeneralStructure() {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                d.target.set((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20);
                d.color.setHex(P.pointer);
            }
        }

        function updateHUD(title, sub, color) {
            document.getElementById('hud-title').innerText = title;
            document.getElementById('hud-title').style.color = color;
            document.getElementById('hud-sub').innerText = sub;
            document.getElementById('status-hud').style.borderColor = color;
            document.getElementById('status-hud').style.boxShadow = `0 0 25px ${color}40`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
